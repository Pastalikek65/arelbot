global:
  resolve_timeout: 5m

route:
  receiver: arelbot-webhook
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: arelbot-webhook
    webhook_configs:
      - url_file: /run/secrets/arelbot_alert_webhook_url
        send_resolved: true
        max_alerts: 20
