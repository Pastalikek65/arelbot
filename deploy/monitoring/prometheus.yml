global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: arelbot-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:9108"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/arelbot_observability_token
  - job_name: arelbot-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9109"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/arelbot_observability_token
