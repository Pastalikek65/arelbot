# Use together with ../docker-compose.yml, --project-name arelbot-prod.
# No published ports. Only the proxy receives the operator's account file.
services:
  d2api:
    build:
      context: .
      dockerfile: deploy/d2api.Dockerfile
    profiles: ["prod"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: ${D2API_ENV_FILE:-/opt/arel/shared/d2api/proxy.env}
    environment:
      HOST: 0.0.0.0
      PORT: "9655"
      LOG_REQUESTS: "0"
      DELETE_SESSIONS: "1"
      MAX_CONCURRENT: "2"
      MAX_BODY_BYTES: "1048576"
      DEEPSEEK_TIMEOUT_MS: "18000"
      DEEPSEEK_STREAM_TIMEOUT_MS: "18000"
    volumes:
      - ${D2API_ACCOUNT_DIR:-/opt/arel/shared/d2api/accounts}:/data
      - ${D2API_WASM_FILE:-/opt/arel/shared/d2api/assets/deepseek_hash.wasm}:/app/assets/deepseek_hash.wasm:ro
    tmpfs:
      - /tmp:size=16M,mode=1777
    mem_limit: 384m
    pids_limit: 64
    cpus: 1.0
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9655/health',{signal:AbortSignal.timeout(2000)}).then(async r=>{const h=await r.json();process.exit(r.ok&&h.ok&&h.ready>0?0:1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 3
