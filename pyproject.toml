[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
timeout = 300
# Pin the coverage configuration path for every pytest run. pytest-cov otherwise
# exports its default ".coveragerc" path to subprocesses; a subprocess that
# starts in another working directory then finds no configuration, records
# statement-only data and aborts the run with "Can't combine branch coverage
# data with statement data". The option only pins the path, it does not enable
# coverage, so a plain "pytest -q" still runs without collecting coverage.
addopts = ["--cov-config=pyproject.toml"]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# Measured baselines are 63% statement coverage and 60% branch coverage; the
# threshold keeps a five point regression budget below both so the gate reports
# regressions without blocking the current state.
fail_under = 58
show_missing = true
skip_covered = false
omit = [
    "src/tests/*",
    "src/ai/providers/*",
]
