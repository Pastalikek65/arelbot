    <text x="56" y="149" fill="#f2f6fc" font-size="76" font-weight="700" letter-spacing="-2">Arel</text>
    <text x="59" y="202" fill="#d3deed" font-size="26">Telegram için sohbet, araçlar ve topluluk yönetimi</text>
    <text x="59" y="264" fill="#58dcc1" font-size="15" letter-spacing="3">SOHBET · ÜRETKENLİK · TOPLULUK</text>
